name: Build SVR Store APK

on:
  workflow_dispatch: # బ్రౌజర్ నుండే ఒక క్లిక్‌తో రన్ చేసుకోవడానికి
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SVR-Store-APK
          path: build/app/outputs/flutter-apk/app-release.apk
